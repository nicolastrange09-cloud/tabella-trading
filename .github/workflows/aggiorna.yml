name: Aggiorna tabella

on:
  schedule:
    - cron: "30 6 * * *"   # ogni giorno alle 06:30 UTC (07:30 o 08:30 in Italia)
  workflow_dispatch:        # permette di avviarlo a mano dal pulsante "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install yfinance pandas

      - name: Calcola segnali e portafoglio
        run: python aggiorna.py

      - name: Salva lo stato del portafoglio virtuale
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "noreply@users.noreply.github.com"
          git add portfolio.json
          if ! git diff --staged --quiet; then
            git commit -m "Aggiorna portafoglio virtuale"
            git push
          fi

      - name: Prepara il sito
        run: |
          mkdir _site
          cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
